name: Verify upstream sync on macOS
on:
  push:
    branches: [verify-sync-nov10]
permissions:
  contents: read
jobs:
  targeted:
    strategy:
      fail-fast: false
      matrix:
        source: [candidate, upstream]
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select pure upstream production sources
        if: matrix.source == 'upstream'
        run: |
          cp packages/web-server/test/browser/delegation-agent-menu.test.ts /tmp/delegation-diagnostic.ts
          git fetch origin 31dc2068ed3eecc40c8222777f18339d1bc39d30
          git checkout 31dc2068ed3eecc40c8222777f18339d1bc39d30
          cp /tmp/delegation-diagnostic.ts packages/web-server/test/browser/delegation-agent-menu.test.ts
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global --prefer-offline npm@11.8.0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - run: npm ci --prefer-offline
      - run: npm run build:typescript
      - run: npx playwright install chromium
      - run: npm run build:web:ui
      - name: Validate auth status compatibility fix
        if: matrix.source == 'candidate'
        working-directory: packages/web-server
        run: node --import tsx --test test/auth-status-http.test.ts test/browser/composer-commands.test.ts test/browser/file-mentions.test.ts
      - name: Repeat isolated delegation and relay tests
        if: always()
        working-directory: packages/web-server
        run: |
          failed=0
          for attempt in 1 2 3; do
            echo "=== isolated delegation attempt $attempt ==="
            node --import tsx --test test/browser/delegation-agent-menu.test.ts || failed=1
            echo "=== isolated relay attempt $attempt ==="
            node --import tsx --test test/browser/relay-tool-output.test.ts || failed=1
          done
          exit $failed
