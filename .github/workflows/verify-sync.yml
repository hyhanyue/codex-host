# Temporary pure-upstream baseline; never merge into main.
name: Verify upstream sync on macOS
on:
  push:
    branches: [verify-sync-nov10]
permissions:
  contents: read
jobs:
  browser-baseline:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global --prefer-offline npm@11.8.0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - run: npm ci --prefer-offline
      - run: npm run build:typescript
      - run: npx playwright install chromium
      - run: npm run build:web:ui
      - name: Candidate browser targeted diagnosis
        working-directory: packages/web-server
        run: node --import tsx --test test/browser/access-tokens.test.ts test/browser/ch-cache-navigation.test.ts test/browser/ch-compaction.test.ts test/browser/ch-resume-stream.test.ts test/browser/ch-scoped-projections.test.ts test/browser/ch-session-cache.test.ts test/browser/ch-session-import.test.ts test/browser/composer-commands.test.ts test/browser/connect-controls.test.ts test/browser/delegation-agent-menu.test.ts test/browser/desktop-screenshot.test.ts test/browser/file-mentions.test.ts test/browser/harness-icons.test.ts test/browser/harness-order.test.ts test/browser/markdown-compatibility.test.ts test/browser/model-selection.test.ts test/browser/phone-sidebar-layering.test.ts test/browser/phone-sidebar.test.ts test/browser/preferences.test.ts test/browser/relay-tool-output.test.ts test/browser/right-sidebar-touch.test.ts test/browser/voice-recorder-layout.test.ts
