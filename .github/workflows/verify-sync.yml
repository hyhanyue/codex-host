# Temporary verification only; never merge this workflow into main.
name: Verify upstream sync on macOS

on:
  push:
    branches:
      - verify-sync-nov10

permissions:
  contents: read

# Cold CI builds skip incremental state and debug symbols, retaining debug assertions.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

# Superseded PR runs are disposable; main runs provide per-commit release evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check macos-26
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Setup npm
        run: npm install --global --prefer-offline npm@11.8.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      # Reuse compiled dependencies; only main refreshes the cache so PRs cannot evict it.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        id: dependencies
        run: npm ci --prefer-offline

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        # The complete test project exceeds Node's default 2 GiB heap on macOS.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run typecheck

      - name: Test TypeScript (full suite)
        run: npm run test:typescript

      # Real Launcher + Node service, with isolated HOME/data and fake Harnesses.
      - name: Test independent Host lifecycle
        run: npm run test:shared-host

      # Rust formatting is already covered by the formatting step.
      - name: Check Rust
        run: >
          cargo clippy --workspace --all-targets --locked
          --features codexhost-shim/test-utils,codexhost-gate-a-native/gate-tools
          -- -D warnings && npm run test:rust

      # Keep packaging evidence even when an unrelated check fails; reuse this runner.
      - name: Smoke-test macOS npm package
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          npm run build:typescript
          node scripts/release/smoke-npm-package.mjs --target macos-arm64 --version 0.1.6-ci.0

      - name: Install Chromium for browser regression tests
        run: npx playwright install chromium

      - name: Build Web UI for browser regression tests
        run: npm run build:web:ui

      - name: Test upstream session controller
        run: npm run test --workspace=@deepseek-ai/dsh-api-session-controller

      - name: Test upstream browser regressions
        run: >
          node --import tsx --test
          packages/web-server/test/browser/ch-core-navigation.test.ts
          packages/web-server/test/browser/ch-mobile-connection.test.ts
          packages/web-server/test/browser/ch-progressive-loading.test.ts
